openapi: 3.0.3
info:
  title: 'TechTutor API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost:8000'
tags:
  - name: Endpoints
    description: ''
paths:
  /api/contact:
    post:
      summary: ''
      operationId: postApiContact
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                subject:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: i
                  nullable: true
                message:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'y'
              required:
                - name
                - email
                - message
      security: []
  /api/auth/register:
    post:
      summary: ''
      operationId: postApiAuthRegister
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                nickname:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: ashly64@example.com
                password:
                  type: string
                  description: ''
                  example: architecto
                role:
                  type: string
                  description: ''
                  example: null
                token_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                captcha_token:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - name
                - nickname
                - email
                - password
      security: []
  /api/auth/register/request-verification-code:
    post:
      summary: ''
      operationId: postApiAuthRegisterRequestVerificationCode
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                nickname:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: ashly64@example.com
                password:
                  type: string
                  description: ''
                  example: architecto
                role:
                  type: string
                  description: ''
                  example: null
                captcha_token:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - name
                - nickname
                - email
                - password
      security: []
  /api/auth/register/verify-code:
    post:
      summary: ''
      operationId: postApiAuthRegisterVerifyCode
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                code:
                  type: string
                  description: 'Must match the regex /^\d{6}$/. Must be 6 characters.'
                  example: miyvdl
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                nickname:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                password:
                  type: string
                  description: ''
                  example: architecto
                role:
                  type: string
                  description: ''
                  example: null
                token_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
              required:
                - email
                - code
                - name
                - nickname
                - password
      security: []
  '/api/auth/invite/{token}/accept':
    post:
      summary: ''
      operationId: postApiAuthInviteTokenAccept
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                nickname:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                password:
                  type: string
                  description: ''
                  example: architecto
                token_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
              required:
                - name
                - nickname
                - password
      security: []
    parameters:
      -
        in: path
        name: token
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/auth/login:
    post:
      summary: ''
      operationId: postApiAuthLogin
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                token_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                captcha_token:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/auth/forgot-password:
    post:
      summary: ''
      operationId: postApiAuthForgotPassword
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: ''
      operationId: postApiAuthResetPassword
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '-0pBNvYgxw'
              required:
                - token
                - email
                - password
      security: []
  /api/stripe/webhook:
    post:
      summary: ''
      operationId: postApiStripeWebhook
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/auth/me:
    patch:
      summary: ''
      operationId: patchApiAuthMe
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                nickname:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                bio:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: g
                  nullable: true
                email_notifications_enabled:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_comment_reply:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_thread:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_quiz_result:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_new_course:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_new_content:
                  type: boolean
                  description: ''
                  example: false
                email_notifications_new_enrollment:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_instructor_quiz_result:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_approval_result:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_course_submitted:
                  type: boolean
                  description: ''
                  example: true
                email_notifications_lesson_submitted:
                  type: boolean
                  description: ''
                  example: true
                avatar:
                  type: string
                  format: binary
                  description: 'Must be a file. Must be an image. Must not be greater than 2048 kilobytes.'
                remove_avatar:
                  type: boolean
                  description: ''
                  example: true
      security: []
    delete:
      summary: ''
      operationId: deleteApiAuthMe
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/auth/logout:
    post:
      summary: ''
      operationId: postApiAuthLogout
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/auth/email/resend:
    post:
      summary: ''
      operationId: postApiAuthEmailResend
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/admin/users/invites:
    post:
      summary: ''
      operationId: postApiAdminUsersInvites
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                role:
                  type: string
                  description: ''
                  example: instructor
                  enum:
                    - student
                    - instructor
                    - admin
              required:
                - email
                - role
      security: []
  '/api/admin/users/{user_id}':
    patch:
      summary: ''
      operationId: patchApiAdminUsersUser_id
      description: ''
      parameters: []
      responses: {}
      tags:
