      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: ''
                  example: student
                  enum:
                    - student
                    - instructor
                    - admin
                is_banned:
                  type: boolean
                  description: ''
                  example: false
      security: []
    delete:
      summary: ''
      operationId: deleteApiAdminUsersUser_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/admin/moderation-queue/reviews/{review_id}':
    patch:
      summary: ''
      operationId: patchApiAdminModerationQueueReviewsReview_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_published:
                  type: boolean
                  description: ''
                  example: false
                declined_reason:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
              required:
                - is_published
      security: []
    parameters:
      -
        in: path
        name: review_id
        description: 'The ID of the review.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/admin/moderation-queue/publish-requests/{publishRequest_id}':
    patch:
      summary: ''
      operationId: patchApiAdminModerationQueuePublishRequestsPublishRequest_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: ''
                  example: accept
                  enum:
                    - accept
                    - decline
                declined_reason:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
              required:
                - action
      security: []
    parameters:
      -
        in: path
        name: publishRequest_id
        description: 'The ID of the publishRequest.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/admin/moderation-queue/lesson-revisions/{lessonRevision_id}':
    patch:
      summary: ''
      operationId: patchApiAdminModerationQueueLessonRevisionsLessonRevision_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: ''
                  example: accept
                  enum:
                    - accept
                    - decline
                declined_reason:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
              required:
                - action
      security: []
    parameters:
      -
        in: path
        name: lessonRevision_id
        description: 'The ID of the lessonRevision.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/admin/moderation-queue/quiz-revisions/{quizRevision_id}':
    patch:
      summary: ''
      operationId: patchApiAdminModerationQueueQuizRevisionsQuizRevision_id
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: ''
                  example: decline
                  enum:
                    - accept
                    - decline
                declined_reason:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
              required:
                - action
      security: []
    parameters:
      -
        in: path
        name: quizRevision_id
        description: 'The ID of the quizRevision.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/courses/{course_slug}/certificate':
    post:
      summary: 'Issue a new certificate if eligible'
      operationId: issueANewCertificateIfEligible
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: course_slug
        description: 'The slug of the course.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/courses/{course_slug}/publish-request':
    post:
      summary: ''
      operationId: postApiCoursesCourse_slugPublishRequest
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: course_slug
        description: 'The slug of the course.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/modules/{module_id}/lessons/reorder':
    patch:
      summary: 'Reorder lessons within a module.'
      operationId: reorderLessonsWithinAModule
      description: "PATCH /modules/{module}/lessons/reorder\n\nBody: { \"ids\": [3, 1, 2] }  — ordered list of lesson IDs with positions 0, 1, 2..."
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: ''
                  example:
                    - 16
                  items:
                    type: integer
      security: []
    parameters:
      -
        in: path
        name: module_id
        description: 'The ID of the module.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/courses/{course_slug}/quizzes/reorder':
    patch:
      summary: 'Reorder quizzes within a course (optionally scoped to a module).'
      operationId: reorderQuizzesWithinACourseoptionallyScopedToAModule
      description: "PATCH /courses/{course}/quizzes/reorder\n\nBody: { \"module_id\": 5, \"ids\": [3, 1, 2] }  — ordered list of quiz IDs with positions 0, 1, 2...\nIf module_id is provided, reorder is scoped to that module."
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: ''
                  example:
                    - 16
                  items:
                    type: integer
                module_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
      security: []
    parameters:
      -
        in: path
        name: course_slug
        description: 'The slug of the course.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/modules/{module_id}/content/reorder':
    patch:
      summary: 'Reorder any content within a module (lessons and quizzes together).'
      operationId: reorderAnyContentWithinAModulelessonsAndQuizzesTogether
      description: "PATCH /modules/{module}/content/reorder\n\nBody: { \"items\": [\n  { \"type\": \"lesson\", \"id\": 1 },\n  { \"type\": \"quiz\", \"id\": 5 },\n  { \"type\": \"lesson\", \"id\": 2 }\n]}\n\nPositions are assigned 0, 1, 2... based on order in array."
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: ''
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: ''
                        example: quiz
                        enum:
                          - lesson
                          - quiz
                      id:
                        type: integer
                        description: ''
                        example: 16
                    required:
                      - type
                      - id
              required:
                - items
      security: []
    parameters:
      -
        in: path
        name: module_id
        description: 'The ID of the module.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/courses/{course_slug}/modules/reorder':
    patch:
      summary: 'Reorder modules within a course.'
      operationId: reorderModulesWithinACourse
      description: "PATCH /courses/{course}/modules/reorder\n\nBody: { \"ids\": [3, 1, 2] }  — ordered list of module IDs with positions 0, 1, 2..."
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: ''
                  example:
                    - 16
                  items:
                    type: integer
      security: []
    parameters:
      -
        in: path
        name: course_slug
        description: 'The slug of the course.'
        example: architecto
        required: true
        schema:
          type: string
  /api/courses:
    post:
      summary: 'Store a newly created resource in storage.'
      operationId: storeANewlyCreatedResourceInStorage
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                slug:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                subtitle:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: d
                  nullable: true
                level:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: l
                  nullable: true
                language:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: j
                  nullable: true
                what_you_will_learn:
                  type: array
                  description: 'Must not be greater than 500 characters.'
                  example:
                    - 'n'
                  items:
                    type: string
                price_benefits:
                  type: array
                  description: 'Must not be greater than 500 characters.'
                  example:
                    - i
                  items:
                    type: string
                tags:
                  type: array
                  description: 'Must not be greater than 40 characters.'
                  example:
                    - k
                  items:
                    type: string
                thumbnail_path:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: h
                  nullable: true
                duration_minutes:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 87
                  nullable: true
                price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 39
                  nullable: true
                is_published:
                  type: boolean
                  description: ''
                  example: true
                published_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-06-14T17:39:15'
                  nullable: true
                request_publish:
                  type: boolean
                  description: ''
                  example: true
              required:
                - title
                - slug
      security: []
  '/api/courses/{slug}':
    put:
      summary: 'Update the specified resource in storage.'
      operationId: updateTheSpecifiedResourceInStorage
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                slug:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 255 characters.'
                  example: 'n'
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                subtitle:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: d
                  nullable: true
                level:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: l
                  nullable: true
                language:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: j
                  nullable: true
                what_you_will_learn:
                  type: array
                  description: 'Must not be greater than 500 characters.'
                  example:
                    - 'n'
                  items:
                    type: string
                price_benefits:
                  type: array
                  description: 'Must not be greater than 500 characters.'
                  example:
                    - i
                  items:
                    type: string
                tags:
                  type: array
                  description: 'Must not be greater than 40 characters.'
                  example:
                    - k
                  items:
                    type: string
                thumbnail_path:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: h
                  nullable: true
                duration_minutes:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 87
                  nullable: true
                price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 39
                  nullable: true
                is_published:
                  type: boolean
                  description: ''
                  example: true
                published_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-06-14T17:39:18'
                  nullable: true
                request_publish:
                  type: boolean
                  description: ''
                  example: true
                decline_publish:
                  type: boolean
                  description: ''
                  example: false
                publish_request_declined_reason:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'y'
                  nullable: true
      security: []
    delete:
      summary: 'Remove the specified resource from storage.'
      operationId: removeTheSpecifiedResourceFromStorage
