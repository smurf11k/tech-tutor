services:
  db:
    image: postgres:16
    container_name: techtutor_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/database/data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: techtutor_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ./backend/storage/meilisearch:/meili_data

  minio:
    image: minio/minio:latest
    container_name: techtutor_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./backend/storage/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/techtutor
        mc anonymous set download local/techtutor
        cat >/tmp/techtutor-cors.json <<'EOF'
        [
          {
            "AllowedOrigins": ["http://localhost:5173", "http://127.0.0.1:5173"],
            "AllowedMethods": ["GET", "HEAD", "OPTIONS"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag", "Content-Length", "Content-Range", "Accept-Ranges"],
            "MaxAgeSeconds": 3000
          }
        ]
        EOF
        mc cors set local/techtutor /tmp/techtutor-cors.json
