services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./backend/.env.production
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    env_file:
      - ./backend/.env.production
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing local/$$AWS_BUCKET

  migrate-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: db
      MEILISEARCH_HOST: http://meilisearch:7700
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["sh", "/var/www/html/docker/init-database.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: db
      MEILISEARCH_HOST: http://meilisearch:7700
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate-seed:
        condition: service_completed_successfully
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: db
      MEILISEARCH_HOST: http://meilisearch:7700
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    command: ["sh", "-c", "php artisan queue:work database --tries=3 --timeout=14400 --sleep=5"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:80}
      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-https://site-28.phfk.college}
      STRIPE_CURRENCY: EUR
      VITE_STRIPE_CURRENCY: EUR
      VITE_CAPTCHA_SITE_KEY: ${VITE_CAPTCHA_SITE_KEY:-}
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-20028}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  meilisearch_data:
  minio_data:
  backend_storage:
  backend_bootstrap_cache:
